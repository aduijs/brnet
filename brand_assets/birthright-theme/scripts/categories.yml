# Birthright category restructure spec.
# Read by scripts/setup.rb. Edit this, re-run setup.rb to apply.
#
# Mirrors the 4 sections shown in the prototype:
#   ANNOUNCEMENTS / DUNGEONS & DRAGONS / EXPANSIONS / PLAY-BY-POST & SOCIAL GROUPS

parents:
  - slug: announcements-section
    name: Announcements
    color: "C8466A"
    text_color: "FFFFFF"
    position: 0
  - slug: dungeons-and-dragons
    name: Dungeons & Dragons
    color: "D96652"
    text_color: "FFFFFF"
    position: 1
  - slug: expansions
    name: Expansions
    color: "5FA869"
    text_color: "FFFFFF"
    position: 2
  - slug: play-by-post-and-social-groups
    name: Play-by-Post & Social Groups
    color: "9B6FCF"
    text_color: "FFFFFF"
    position: 3

# Categories visible in the new design. Anything not listed gets archived.
visible:
